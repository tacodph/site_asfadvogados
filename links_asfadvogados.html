<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;}
a{color:#A9834C;}
a:hover{color:#C29A5E;}
</style>
</helmet>
<div style="min-height:100vh;background:#F5EFE3;font-family:Manrope,sans-serif;color:#16140F;display:flex;justify-content:center;">
  <div style="width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;padding:64px 24px 48px;">

    <img src="uploads/gabriel.jpeg" alt="ASF Advogados" style="width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;margin-bottom:20px;" />
    <p style="font-family:Newsreader,serif;font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:.01em;">ASF ADVOGADOS</p>
    <p style="font-size:13px;line-height:1.6;color:#6B6455;text-align:center;margin:0 0 8px;max-width:300px;">Advocacia especializada em concursos e servidores públicos.</p>
    <p style="font-size:12px;color:#8B6B3D;font-weight:700;margin:0 0 36px;">★★★★★ 5.0 no Google · +900 processos</p>

    <div style="display:flex;flex-direction:column;gap:12px;width:100%;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" target="_blank" rel="noopener" style="{{ l.style }}">
          <span style="{{ l.iconStyle }}">{{ l.icon }}</span>
          <span style="flex:1;">{{ l.label }}</span>
        </a>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;width:100%;margin-top:28px;">
      <sc-for list="{{ faq }}" as="f" hint-placeholder-count="3">
        <div style="border-bottom:1px solid rgba(22,20,15,0.1);">
          <button onClick="{{ f.toggle }}" style="width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 2px;background:none;border:none;cursor:pointer;text-align:left;">
            <span style="font-size:13px;font-weight:700;color:#16140F;line-height:1.4;">{{ f.q }}</span>
            <span style="font-size:17px;color:#A9834C;flex-shrink:0;">{{ f.indicator }}</span>
          </button>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <p style="font-size:12px;line-height:1.65;color:#6B6455;margin:0 0 16px;padding:0 2px;">{{ f.a }}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <p style="font-size:10px;letter-spacing:.05em;color:#9A9382;margin-top:36px;text-align:center;">© {{ year }} ASF ADVOGADOS · TODOS OS DIREITOS RESERVADOS</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:820},&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5561982777896&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { openFaq: -1 };

  renderVals() {
    const p = this.props || {};
    const whatsappNumber = p.whatsappNumber || '5561982777896';
    const msg = (t) => 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(t);
    const base = 'display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;';
    const iconBase = 'width:20px;text-align:center;font-size:15px;flex-shrink:0;';

    const raw = [
      ['\u260E', 'Fale no WhatsApp', msg('Olá! Vim pelo link do Instagram e gostaria de falar com o time de especialistas.'), true],
      ['\u2605', 'Ver avaliações no Google', 'https://www.google.com.br/search?kgmid=%2Fg%2F11nn40c4t_&hl=pt-BR&q=ASF+ADVOGADOS', false],
      ['\u2637', 'Agendar uma consulta', msg('Olá! Vim pelo link do Instagram e gostaria de agendar uma consulta.'), false],
      ['\u25A1', 'Acessar o site', 'index.dc.html', false],
      ['\u270E', 'Artigos', 'Artigos.dc.html', false],
    ];

    const faqRaw = [
      ['ASF ADVOGADOS CONCURSOS pode me ajudar caso eu seja de outro estado?', 'Atuamos em todo o território nacional e, por isso, possuímos clientes em todo o Brasil. Portanto, isso não é fator impeditivo para que te representemos juridicamente.'],
      ['A atuação do escritório é apenas em ações judiciais?', 'Não. Nós atuamos tanto na via judicial, quanto na via administrativa, com recursos administrativos.'],
      ['O escritório trabalha com demandas de servidores?', 'Sim, atuamos em demandas de servidores e auxiliamos nossos clientes com ações que resguardam os seus direitos.'],
    ];

    return {
      year: new Date().getFullYear(),
      links: raw.map(([icon, label, href, primary]) => ({
        icon, label, href,
        style: base + (primary
          ? 'background:#16140F;color:#F5EFE3;'
          : 'background:#FBF8F2;color:#16140F;border:1px solid rgba(22,20,15,0.12);'),
        iconStyle: iconBase + (primary ? 'color:#A9834C;' : 'color:#8B6B3D;'),
      })),
      faq: faqRaw.map(([q, a], i) => ({
        q, a,
        open: this.state.openFaq === i,
        indicator: this.state.openFaq === i ? '\u2212' : '+',
        toggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i })),
      })),
    };
  }
}
</script>
</body>
</html>
